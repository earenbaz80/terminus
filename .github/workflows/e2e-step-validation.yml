name: E2E Step Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-steps:
    name: Validar recuentos de pasos E2E en Windows
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Marca que este job necesita una sesión interactiva de escritorio.
      # El runner de GitHub en windows-latest suele tenerla, pero si se ejecuta
      # sobre una cuenta de servicio sin escritorio fallará el preflight.
      TERMINUS_E2E_REQUIRES_DESKTOP: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight - validar sesión interactiva
        if: always()
        shell: pwsh
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          if ($sessionId -eq 0) {
            throw "El E2E instalado requiere una sesión interactiva, pero el runner está en la sesión 0. Arranca el runner con run.cmd en una sesión de escritorio, no con svc.cmd."
          }
          if (-not [Environment]::UserInteractive) {
            throw "El E2E instalado requiere [Environment]::UserInteractive = true. Revisa la sesión del runner y consulta docs/e2e-installed-windows.md."
          }
          Write-Host "Sesión interactiva detectada: SessionId=$sessionId"

      - name: Verificar ejecutable instalado
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Terminus\Terminus.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "No se encontró la app instalada en $exe. Instala el build actual antes de ejecutar la validación de pasos."
          }
          Write-Host "Ejecutable instalado verificado: $exe"

      - name: Ejecutar E2E y validar recuentos de pasos
        shell: pwsh
        run: |
          # Ejecutar el runner de E2E
          node scripts/e2e-run.mjs
          $exitCode = $LASTEXITCODE
          
          # Leer los logs generados y validar recuentos de pasos
          $outDir = "artifacts/e2e"
          
          if (-not (Test-Path -LiteralPath $outDir)) {
            Write-Error "Directorio de logs no encontrado: $outDir"
            exit 1
          }
          
          # Mapeo de suites a nombres de archivo de log (según e2e-suites.mjs)
          $stepValidation = @{
            ctrl-f    = "e2e-installed.log"
            ui        = "e2e-installed-ui.log"
            ui-de     = "e2e-installed-ui-de.log"
            browser   = "e2e-installed-browser.log"
            network   = "e2e-network-policy.log"
          }
          $allPassed = $true
          
          foreach ($suiteLabel in @('ctrl-f', 'ui', 'ui-de', 'browser', 'network')) {
            $logFile = $stepValidation[$suiteLabel]
            $logPath = Join-Path $outDir $logFile
            
            if (-not (Test-Path -LiteralPath $logPath)) {
              Write-Host "⚠ Log no encontrado para suite: $suiteLabel ($logPath)"
              $allPassed = $false
              continue
            }
            
            $logContent = Get-Content -LiteralPath $logPath -Encoding utf8
            $stepsPattern = [regex]::Match($logContent, 'STEPS: (\d+)/(\d+)')
            
            if (-not $stepsPattern.Success) {
              Write-Error "[$suiteLabel] No se encontró el patrón STEPS: n/m en el log."
              $allPassed = $false
              continue
            }
            
            $executed = [int]$stepsPattern.Groups[1].Value
            $expected = [int]$stepsPattern.Groups[2].Value
            
            Write-Host "[$suiteLabel] Pasos: $executed/$expected"
            
            if ($executed -ne $expected) {
              Write-Error "[$suiteLabel] DESINCRIMINACIÓN: Ejecutó $executed pasos pero se esperaban $expected."
              $allPassed = $false
            } else {
              Write-Host "[$suiteLabel] ✅ Recuento de pasos correcto"
            }
          }
          
          if (-not $allPassed) {
            Write-Error "Validación de recuentos de pasos fallida. Consulte los errores arriba."
            exit 1
          }
          
          Write-Host "✅ Todos los recuentos de pasos están sincronizados."

      - name: Fallo en validación de pasos
        if: failure()
        run: |
          Escribe aquí cualquier acción de notificación o reporte que desees
          cuando la validación de recuentos de pasos falla.
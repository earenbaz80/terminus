name: E2E Step Validation

# Valida que cada suite del E2E instalado cierre con «STEPS: n/m» igual al total
# que declara `scripts/e2e-suites.mjs`. Esa comprobación la hace el propio
# `scripts/e2e-run.mjs` (vía `scripts/lib/e2e-report.mjs`), así que el recuento
# esperado vive en un solo sitio y este workflow no lo duplica.
#
# El E2E instalado corre contra la app instalada, no contra el árbol de trabajo:
# por eso el job compila el instalador NSIS, lo instala con `/S` y solo entonces
# lanza las suites. Un runner alojado (`windows-latest`) trae Windows limpio y no
# tiene Terminus instalado, así que sin este paso el E2E nunca podría ejecutarse.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-step-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-steps:
    name: Validar recuentos de pasos E2E en Windows
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      # Marca que este job necesita una sesión interactiva de escritorio.
      TERMINUS_E2E_REQUIRES_DESKTOP: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El E2E instalado usa SendKeys y ventanas reales: sin escritorio no corre.
      # Falla antes de compilar nada, así que no se gasta el build en balde.
      - name: Preflight de sesión interactiva
        shell: pwsh
        timeout-minutes: 1
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          if ($sessionId -eq 0) {
            throw "El E2E instalado requiere una sesión interactiva, pero el runner está en la sesión 0. Arranca el runner con run.cmd en una sesión de escritorio, no con svc.cmd. Consulta docs/e2e-installed-windows.md."
          }
          if (-not [Environment]::UserInteractive) {
            throw "El E2E instalado requiere [Environment]::UserInteractive = true. Revisa la sesión del runner y consulta docs/e2e-installed-windows.md."
          }
          Write-Host "Sesión interactiva detectada: SessionId=$sessionId"

      - name: Compilar la app y el instalador NSIS
        run: npm run desktop:build

      # Instala el build de este commit y deja `TERMINUS_INSTALLED_EXE` para las
      # suites. El NSIS puede abrir la app al terminar; el E2E arranca su propia
      # instancia, así que se cierra cualquier proceso que haya quedado vivo.
      - name: Instalar el build actual
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Terminus Setup *.exe' |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador NSIS.'
          }

          Write-Host "Instalando $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El instalador terminó con código $($process.ExitCode)."
          }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Terminus\Terminus.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "No se encontró la app instalada en $exe."
          }

          Get-Process -Name Terminus -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          "TERMINUS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Ejecutable instalado: $exe"

      # `e2e-run.mjs` recorre `e2e-suites.mjs`, lanza cada suite con `npm run`,
      # guarda su log en `artifacts/e2e/<log>` y falla si una suite no cierra con
      # el recuento esperado. Una suite que sale con 0 pero perdió un paso pone el
      # job en rojo igual.
      #
      # `--only`: hoy solo `ctrl-f` y `network` cierran su recuento completo.
      # `ui` y `ui-de` mueren en el paso 6 (5/15) y `browser` en los pasos 4-5
      # (3/5), igual en local que en el runner: son fallos de esas suites, no del
      # pipeline. Quedan fuera para que este check no esté en rojo en cada push y
      # PR por un problema ya conocido; al arreglarlas, quitar `--only` las
      # devuelve todas (el recuento esperado sigue viviendo en
      # `scripts/e2e-suites.mjs`, no aquí).
      - name: Ejecutar E2E y validar recuentos de pasos
        run: node scripts/e2e-run.mjs --only ctrl-f,network

      # Los logs y las capturas se suben también cuando el paso falla, que es
      # justo cuando hacen falta para diagnosticar (`failure-<suite>-<sello>.log`).
      - name: Publicar logs del E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-step-validation-logs
          path: |
            artifacts/e2e/*.log
            artifacts/e2e/*.png
          if-no-files-found: ignore
